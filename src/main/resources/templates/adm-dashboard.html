<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <div th:replace="~{fragments/header :: header-css}"/>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1 0 auto;
        }
    </style>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="~{fragments/header :: header}"/>
<main class="flex-shrink-0">
    <div class="container mt-4">
        <h1 class="mb-4">Dashboard</h1>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title"><strong>Estadísticas de Garages</strong></h5>
                        <p class="card-text"><strong>Total Garages:</strong> <span th:text="${garages.size()}"></span></p>
                        <p class="card-text"><strong>Garages Vacíos:</strong> <span th:text="${garages.?[vehiculoGuardado == null].size()}"></span></p>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title"><strong>Estadísticas de Vehículos</strong></h5>
                        <p class="card-text"><strong>Total Vehículos:</strong> <span th:text="${vehiculos.size()}"></span></p>
                        <p class="card-text"><strong>Vehículos sin Garage:</strong> <span th:text="${vehiculos.?[fechaAsignacion == null].size()}"></span></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Resumen General</h5>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                <tr>
                                    <th>Tipo</th>
                                    <th>Cantidad</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr>
                                    <td>Garages</td>
                                    <td th:text="${garages.size()}"></td>
                                </tr>
                                <tr>
                                    <td>Garages Vacíos</td>
                                    <td th:text="${garages.?[vehiculoGuardado == null].size()}"></td>
                                </tr>
                                <tr>
                                    <td>Garages sin Vender</td>
                                    <td th:text="${garages.?[socio == null].size()}"></td>
                                </tr>
                                <tr>
                                    <td>Vehículos</td>
                                    <td th:text="${vehiculos.size()}"></td>
                                </tr>
                                <tr>
                                    <td>Vehículos sin Garage</td>
                                    <td th:text="${vehiculos.?[fechaAsignacion == null].size()}"></td>
                                </tr>
                                <tr>
                                    <td>Zonas</td>
                                    <td th:text="${zonas.size()}"></td>
                                </tr>
                                <tr>
                                    <td>Empleados</td>
                                    <td th:text="${empleados.size()}"></td>
                                </tr>
                                <tr>
                                    <td>Socios</td>
                                    <td th:text="${socios.size()}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
