<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <div th:fragment="header-css">
        <base href="/"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!--        <link rel="stylesheet" th:href="@{/css/main.css}"-->
<!--              href="../../css/main.css"/>-->
        <link rel="icon" type="image/png" href="/img/logo.png" sizes="32x32">
        <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    </div>
</head>
<body>
<div th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" th:href="@{/dashboard}"> <img src="/img/logo.png" width="35" height="40"
                                                         style="background: none"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/dashboard}">Inicio <span class="sr-only"></span></a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/about}">Acerca De</a>
                </li>
                <div sec:authorize="hasAnyRole('ROLE_ADMIN')">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownAdminMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Admin Panel
                        </a>
                        <div class="dropdown-menu" aria-labelledby="navbarDropdownAdminMenuLink">
                            <a class="dropdown-item" th:href="@{/api/socio}">Socios</a>

                        </div>
                    </li>
                </div>
                <div sec:authorize="hasAnyRole('ROLE_SOCIO')">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownSocioMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Gestion de Socio
                        </a>
                        <div class="dropdown-menu" aria-labelledby="navbarDropdownSocioMenuLink">
                            <a class="dropdown-item" th:href="@{/api/socio}">Socio</a>

                        </div>
                    </li>
                </div>
                <div sec:authorize="hasAnyRole('ROLE_EMPLEADO')">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownEmpleadoMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Gestion de Empleado
                        </a>
                        <div class="dropdown-menu" aria-labelledby="navbarDropdownEmpleadoMenuLink">
                            <a class="dropdown-item" th:href="@{/api/empleado}">Empleado</a>

                        </div>
                    </li>
                </div>
            </ul>

            <a sec:authorize="isAuthenticated()" class="btn btn-outline-light btn-sm ml-auto"
               th:href="@{/logout}">Cerrar Sesion</a>
        </div>
        </ul>
    </nav>
</div>
</body>
</html>
