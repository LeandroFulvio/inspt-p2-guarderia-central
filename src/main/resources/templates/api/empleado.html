<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Empleado</title>
    <div th:replace="~{fragments/header :: header-css}"/>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1 0 auto;
        }
    </style>
</head>
<body>
<body class="d-flex flex-column h-100">
<div th:replace="~{fragments/header :: header}"/>
<main class="flex-shrink-0">
    <div class="container mt-4">
        <div class="container mt-4" sec:authorize="hasRole('ROLE_ADMIN')">
            <h2 id="formTitle">Registrar Empleado</h2>
            <form th:object="${empleadoForm}" th:action="@{/api/empleado}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Información de Usuario</h5>
                                <div class="mb-3">
                                    <label for="firstname" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="firstname" name="firstname" required>
                                </div>
                                <div class="mb-3">
                                    <label for="lastname" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="lastname" name="lastname" required>
                                </div>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Nombre de usuario</label>
                                    <input type="text" class="form-control" id="username" name="username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Información de Empleado</h5>
                                <div class="mb-3">
                                    <label for="codigo" class="form-label">Código</label>
                                    <input type="text" class="form-control" id="codigo" name="codigo" required>
                                </div>
                                <div class="mb-3">
                                    <label for="especialidad" class="form-label">Especialidad</label>
                                    <input type="text" class="form-control" id="especialidad" name="especialidad"
                                           required>
                                </div>
                                <div class="mb-3">
                                    <label for="dni" class="form-label">DNI</label>
                                    <input type="number" class="form-control" id="dni" name="dni" required>
                                </div>
                                <div class="mb-3">
                                    <label for="direccion" class="form-label">Dirección</label>
                                    <input type="text" class="form-control" id="direccion" name="direccion" required>
                                </div>
                                <div class="mb-3">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <input type="tel" class="form-control" id="telefono" name="telefono" required>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="submitButton">Registrar Empleado</button>
            </form>

        </div>
        <div class="col-md-6 mb-4">
            <h1>Empleados</h1>
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>Codigo</th>
                    <th>Username</th>
                    <th>Especialidad</th>
                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Direccion</th>
                    <th>Telefono</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="empleado : ${empleados}">
                    <td th:text="${empleado.codigo}"></td>
                    <td th:text="${empleado.user.username}"></td>
                    <td th:text="${empleado.especialidad}"></td>
                    <td th:text="${empleado.dni}"></td>
                    <td th:text="${empleado.user.firstname}"></td>
                    <td th:text="${empleado.user.lastname}"></td>
                    <td th:text="${empleado.direccion}"></td>
                    <td th:text="${empleado.telefono}"></td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/api/empleado/edit/{id}(id=${empleado.id})}"
                               sec:authorize="hasRole('ROLE_ADMIN')"
                               class="btn btn-primary btn-sm" >Editar</a>
                            <a th:href="@{/api/empleado/delete/{id}(id=${empleado.id})}"
                               onclick="return confirm('Confirmar Eliminacion')"
                               sec:authorize="hasRole('ROLE_ADMIN')"
                               class="btn btn-danger btn-sm" >Borrar</a>
                        </div>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/api/asignacion/empleado/{id}(id=${empleado.id})}"
                               sec:authorize="hasRole('ROLE_ADMIN')"
                               class="btn btn-primary btn-sm" >Asignar Zona</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
