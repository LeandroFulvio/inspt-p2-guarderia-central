<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Socios</title>
  <div th:replace="~{fragments/header :: header-css}"/>
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1 0 auto;
    }
  </style>
</head>
<body>
<body class="d-flex flex-column h-100">
<div th:replace="~{fragments/header :: header}"/>
<main class="flex-shrink-0">

  <div class="container mt-4">
    <div class="col-md-10 mb-4">
      <h1>Socio</h1>
      <table class="table table-striped table-hover">
        <thead>
        <tr>
          <th>Matricula</th>
          <th>Nombre</th>
          <th>Socio</th>
          <th>Tipo de Vehiculo</th>
          <th>Fecha de Asignacion</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="vehiculo : ${vehiculos}">
          <td th:text="${vehiculo.matricula}"></td>
          <td th:text="${vehiculo.nombre}"></td>
          <td th:text="${vehiculo.socio.user.username}"></td>
          <td th:text="${vehiculo.tipoVehiculo.nombre}"></td>
          <td th:text="${#dates.format(vehiculo.fechaAsignacion, 'dd-MM-yyyy')}"></td>
          <td style="white-space: nowrap">
            <a th:href="@{/api/vehiculo/edit/{id}(id=${vehiculo.id})}"
               sec:authorize="hasRole('ROLE_ADMIN')"
               class="btn btn-primary btn-sm">Editar</a>
            <a th:href="@{/api/vehiculo/delete/{id}(id=${vehiculo.id})}"
               onclick="return confirm('Confirmar Eliminacion')"
               sec:authorize="hasRole('ROLE_ADMIN')"
               class="btn btn-danger btn-sm">Borrar</a>
          </td>
          <td>
            <a th:href="@{/api/vehiculo/socio/{id}(id=${vehiculo.socio.id})}"
               sec:authorize="hasRole('ROLE_ADMIN')"
               class="btn btn-success btn-sm">Asignar Garage</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

  </div>

</main>
<div th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
