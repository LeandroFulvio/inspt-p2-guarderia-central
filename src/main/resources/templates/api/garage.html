<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Garages</title>
    <div th:replace="~{fragments/header :: header-css}"/>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1 0 auto;
        }
    </style>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="~{fragments/header :: header}"/>
<main class="flex-shrink-0">
    <div class="container mt-4">
        <div class="col-md-6 mb-4">
            <h1>Garages</h1>
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>Numero</th>
                    <th>Contador Luz</th>
                    <th>Mantenimiento</th>
                    <th>Fecha Compra</th>
                    <th>Socio</th>
                    <th>Vehiculo</th>
                    <th>Zona</th>
                    <th>Vehiculos Admitidos</th>
                    <th>Fecha ingreso de Vehiculo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="garage : ${garages}">
                    <td th:text="${garage.numero}"></td>
                    <td th:text="${garage.contadorLuz}"></td>
                    <td th:text="${garage.mantenimientoContratado ? 'Sí' : 'No'}"></td>
                    <td th:text="${garage.fechaCompra != null ? #dates.format(garage.fechaCompra, 'dd-MM-yyyy') : 'N/A'}"></td>
                    <td th:text="${garage.socio != null ? garage.socio.user.username : 'N/A'}"></td>
                    <td th:text="${garage.vehiculoGuardado != null ? garage.vehiculoGuardado.nombre + ' (' + garage.vehiculoGuardado.matricula + ')' : 'N/A'}"></td>
                    <td th:text="${garage.zona != null ? garage.zona.letra : 'N/A'}"></td>
                    <td>
                        <ul th:if="${garage.zona != null}">
                            <li th:each="tipoVehiculo : ${garage.zona.tipoVehiculoAdminitos}" th:text="${tipoVehiculo.nombre}"></li>
                        </ul>
                    </td>
                    <td th:text="${(garage.vehiculoGuardado != null
                                    && garage.vehiculoGuardado.fechaAsignacion !=null)
                                    ? #dates.format(garage.vehiculoGuardado.fechaAsignacion, 'dd-MM-yyyy') : 'N/A'}"></td>
                    <td style="white-space: nowrap">
                        <a th:href="@{/api/garage/edit/{id}(id=${garage.id})}"
                           sec:authorize="hasRole('ROLE_ADMIN')"
                           class="btn btn-primary btn-sm">Editar</a>
                    </td>
                    <td style="white-space: nowrap">
                        <a th:href="@{/api/garage/delete/{id}(id=${garage.id})}"
                           onclick="return confirm('Confirmar Eliminacion')"
                           sec:authorize="hasRole('ROLE_ADMIN')"
                           class="btn btn-danger btn-sm">Borrar</a>
                    </td>

                    <td style="white-space: nowrap" th:if="${garage.socio != null && garage.vehiculoGuardado==null}">
                        <a th:href="@{/api/garage/asignar/{id}(id=${garage.id})}"
                           sec:authorize="hasRole('ROLE_ADMIN')"
                           class="btn btn-primary btn-sm">Asignar Vehiculo</a>
                    </td>

                    <td style="white-space: nowrap" th:if="${garage.vehiculoGuardado != null}">
                        <form th:action="@{/api/garage/liberar/{id}(id=${garage.id})}" method="post" style="display: inline;">
                            <button type="submit" class="btn btn-primary btn-sm"
                                    onclick="return confirm('¿Está seguro que desea liberar este garage?')"
                                    sec:authorize="hasRole('ROLE_ADMIN')">Liberar</button>
                        </form>
                    </td>

                    <td style="white-space: nowrap" th:if="${garage.socio != null}">
                        <form th:action="@{/api/garage/vender/{id}(id=${garage.id})}" method="post" style="display: inline;">
                            <button type="submit"
                                    onclick="return confirm('Confirmar Vender Garage - Se removeran Socio y Vehiculo')"
                                    sec:authorize="hasRole('ROLE_ADMIN')"
                                    class="btn btn-danger btn-sm">Vender Garage</button>
                        </form>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>

        <div class="container mt-4"  th:unless="${socio != null}" sec:authorize="hasRole('ROLE_ADMIN')" >
            <h1>Crear Garage</h1>
            <form th:action="@{/api/garage}" th:object="${garageForm}" method="post">
                <div class="mb-3">
                    <label for="numero" class="form-label">Número</label>
                    <input type="number" class="form-control" id="numero" th:field="*{numero}" required>
                </div>
                <div class="mb-3">
                    <label for="contadorLuz" class="form-label">Contador Luz</label>
                    <input type="number" class="form-control" id="contadorLuz" th:field="*{contadorLuz}" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="mantenimientoContratado" th:field="*{mantenimientoContratado}">
                    <label class="form-check-label" for="mantenimientoContratado">Mantenimiento Contratado</label>
                </div>
                <div class="mb-3">
                    <label for="socio" class="form-label">Socio (opcional)</label>
                    <select class="form-select" id="socio" th:field="*{socioId}">
                        <option value="">Seleccione un socio</option>
                        <option th:each="socio : ${AllSocios}"
                                th:value="${socio.id}"
                                th:text="${socio.user.username}">
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="zona" class="form-label">Zona</label>
                    <select class="form-select" id="zona" th:field="*{zonaId}" required >
                        <option value="">Seleccione una zona</option>
                        <option th:each="zona : ${zonas}"
                                th:value="${zona.id}"
                                th:text="${zona.letra}">
                        </option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Crear Garage</button>
            </form>
        </div>


    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
