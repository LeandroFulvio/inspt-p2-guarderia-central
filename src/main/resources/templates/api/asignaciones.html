<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonas</title>
    <div th:replace="~{fragments/header :: header-css}"/>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1 0 auto;
        }
    </style>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="~{fragments/header :: header}"/>
<main class="flex-shrink-0">

    <div class="col-md-10 mb-4 mx-auto">
        <h1>Asignaciones de Zona</h1>
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>Codigo</th>
                <th>Empleado</th>
                <th>Especialidad</th>
                <th>Zona</th>
                <th>Vehiculos a Cargo</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="asignacion : ${AllAsignaciones}">
                <td th:text="${asignacion.empleado.codigo}"></td>
                <td th:text="${asignacion.empleado.user.username}"></td>
                <td th:text="${asignacion.empleado.especialidad}"></td>
                <td th:text="${asignacion.zona.letra}"></td>
                <td th:text="${asignacion.vehiculosACargo}"></td>

                <td style="white-space: nowrap">
                    <a th:href="@{/api/asignacion/edit/{id}(id=${asignacion.id})}"
                       sec:authorize="hasRole('ROLE_ADMIN')"
                       class="btn btn-primary btn-sm">Editar</a>
                    <a th:href="@{/api/asignacion/delete/{id}(id=${asignacion.id})}"
                       onclick="return confirm('Confirmar Eliminacion')"
                       sec:authorize="hasRole('ROLE_ADMIN')"
                       class="btn btn-danger btn-sm">Borrar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
<div th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
