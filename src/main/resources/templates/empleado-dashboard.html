<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <div th:replace="~{fragments/header :: header-css}"/>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1 0 auto;
        }
    </style>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="~{fragments/header :: header}"/>
<main class="flex-shrink-0">
    <div class="container mt-4">
        <h1 class="mb-4">Dashboard</h1>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Estadisticas de Zona a Cargo</h5>
                        <p class="card-text">Total Zonas asignadas: <span th:text="${asignaciones.size()}"></span></p>
                        <p class="card-text">Total Vehiculos en Zonas: <span th:text="${#aggregates.sum(asignaciones.![zona.cantidadVehiculos])}"></span></p>
                        <p class="card-text">Total Vehiculos Asignados: <span th:text="${#aggregates.sum(asignaciones.![vehiculosACargo])}"></span></p>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Informacion del Empleado</h5>
                        <p class="card-text">Nombre: <span th:text="${empleado.user.firstname + ' ' + empleado.user.lastname}"></span></p>
                        <p class="card-text">Codigo: <span th:text="${empleado.codigo}"></span></p>
                        <p class="card-text">Especialidad: <span th:text="${empleado.especialidad}"></span></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Zone Assignments</h5>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                <tr>
                                    <th>Zona</th>
                                    <th>Total Vehiculos en la Zona</th>
                                    <th>Vehiclos asignados</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="asignacion : ${asignaciones}">
                                    <td th:text="${asignacion.zona.letra}"></td>
                                    <td th:text="${asignacion.zona.cantidadVehiculos}"></td>
                                    <td th:text="${asignacion.vehiculosACargo}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
